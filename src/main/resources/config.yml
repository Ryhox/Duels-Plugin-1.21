# Duel settings
duel-time: 180  # Duel duration in seconds
request-timeout: 30  # Request timeout in seconds
default-map: "§cᴅᴜᴇʟѕ ᴍᴀᴘ"  # Default map name
match-mode: "first-to"  # first-to or best-of
default-rounds: 3  # Target wins for first-to, or match size for best-of
round-options: [1, 2, 3, 5, 10]  # GUI choices; players can also type a custom value
min-rounds: 1
max-rounds: 25
bound-arena-random-fallback: false  # If false, bound kits only use their configured arena
default-bestof: 3  # Legacy fallback for old configs
bestof-options: [1, 3, 5, 10]  # Legacy fallback for old configs

# Spawn location
spawn: null
